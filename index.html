<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade 8 ICT - Differences & Comparisons Challenge (120 Qs)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; position: relative; }
    
    /* Top Header & Scoreboard */
    header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); margin-bottom: 20px; border: 1px solid #334155; }
    .game-title { font-size: 1.4rem; font-weight: bold; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .q-counter { font-size: 1.1rem; background: #334155; padding: 6px 18px; border-radius: 20px; font-weight: 600; color: #f1f5f9; }
    
    /* Scoreboard & Team Cards */
    .scoreboard { display: flex; gap: 12px; }
    .team-card { background: #0f172a; padding: 8px 12px; border-radius: 12px; border: 1px solid #475569; text-align: center; min-width: 110px; display: flex; flex-direction: column; justify-content: space-between; }
    .team-header { display: flex; justify-content: center; align-items: center; gap: 4px; }
    .team-name { font-size: 0.85rem; color: #38bdf8; font-weight: bold; text-transform: uppercase; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rename-btn { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 0.75rem; }
    .rename-btn:hover { color: #f59e0b; }
    .team-score { font-size: 1.4rem; font-weight: bold; color: #f59e0b; margin: 2px 0; }
    .score-controls { display: flex; justify-content: center; gap: 4px; }
    .score-btn { background: #334155; color: #fff; border: none; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
    .score-btn:hover { background: #475569; }

    /* Main Question Box */
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 1200px; margin: 0 auto; width: 100%; }
    .round-badge { align-self: center; background: #8b5cf6; color: #fff; padding: 6px 22px; border-radius: 20px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; font-size: 0.95rem; box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3); }
    
    .question-box { background: #1e293b; padding: 35px 30px; border-radius: 20px; text-align: center; box-shadow: 0 15px 30px rgba(0,0,0,0.4); margin-bottom: 25px; border: 2px solid #334155; min-height: 140px; display: flex; align-items: center; justify-content: center; }
    .question-text { font-size: 1.85rem; font-weight: 700; line-height: 1.35; color: #f8fafc; }

    /* Options Grid (Kahoot Theme) */
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
    .option-card { padding: 22px 20px; border-radius: 16px; display: flex; align-items: center; font-size: 1.35rem; font-weight: 600; cursor: pointer; transition: transform 0.15s ease, opacity 0.3s ease; box-shadow: 0 8px 20px rgba(0,0,0,0.25); }
    .option-card:hover { transform: translateY(-3px); }
    
    .shape { font-size: 2rem; margin-right: 18px; opacity: 0.95; }
    .opt-a { background-color: #e21b3c; color: white; }
    .opt-b { background-color: #1368ce; color: white; }
    .opt-c { background-color: #d89e00; color: white; }
    .opt-d { background-color: #26890c; color: white; }

    .dimmed { opacity: 0.2; transform: scale(0.98); }
    .correct-answer { transform: scale(1.03); outline: 4px solid #ffffff; box-shadow: 0 0 35px rgba(255,255,255,0.8); animation: pulse 1s infinite alternate; }

    @keyframes pulse {
      from { box-shadow: 0 0 15px rgba(255,255,255,0.4); }
      to { box-shadow: 0 0 35px rgba(255,255,255,0.95); }
    }

    /* Footer Controls */
    footer { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; width: 100%; background: #1e293b; padding: 15px 25px; border-radius: 16px; border: 1px solid #334155; }
    .control-btn { padding: 12px 26px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    .btn-nav { background: #475569; color: white; }
    .btn-nav:hover { background: #64748b; }
    .btn-reveal { background: #f59e0b; color: #0f172a; font-size: 1.25rem; padding: 12px 36px; }
    .btn-reveal:hover { background: #d97706; }
    .btn-finish { background: #ec4899; color: white; }
    .btn-finish:hover { background: #db2777; }

    /* Winner Popup Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #1e293b; border: 3px solid #f59e0b; border-radius: 24px; padding: 40px; text-align: center; max-width: 650px; width: 90%; box-shadow: 0 25px 50px rgba(0,0,0,0.6); animation: modalPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    
    @keyframes modalPop {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .trophy-icon { font-size: 4.5rem; margin-bottom: 10px; animation: bounce 1s infinite alternate; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-12px); } }
    
    .winner-title { font-size: 2.2rem; color: #f59e0b; font-weight: bold; margin-bottom: 8px; }
    .winner-subtitle { font-size: 1.2rem; color: #cbd5e1; margin-bottom: 25px; }
    .leaderboard-list { margin-bottom: 30px; text-align: left; background: #0f172a; border-radius: 16px; padding: 15px 20px; border: 1px solid #334155; }
    .leaderboard-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1e293b; font-size: 1.2rem; font-weight: 600; }
    .leaderboard-item:last-child { border-bottom: none; }
    .rank-1 { color: #f59e0b; }
    .rank-2 { color: #94a3b8; }
    .rank-3 { color: #b45309; }
    .rank-4 { color: #64748b; }
  </style>
</head>
<body>

  <!-- Header with Scoreboard & Team Rename -->
  <header>
    <div class="game-title">🎮 Grade 8 ICT Differences Challenge</div>
    <div class="q-counter" id="q-counter">Question 1 / 120</div>
    <div class="scoreboard">
      <div class="team-card">
        <div class="team-header">

      <div class="team-card">
        <div class="team-header">
          <span class="team-name" id="tname-1">Team B</span>

        </div>
        <div class="team-score" id="score-1">0</div>
        <div class="score-controls">
          <button class="score-btn" onclick="addScore(1, 100)">+100</button>
          <button class="score-btn" onclick="addScore(1, -50)">-50</button>
        </div>
      </div>

      <div class="team-card">
        <div class="team-header">
          <span class="team-name" id="tname-2">Team C</span>
          <button class="rename-btn" onclick="renameTeam(2)" title="Rename Team">✏️</button>
        </div>
        <div class="team-score" id="score-2">0</div>
        <div class="score-controls">
          <button class="score-btn" onclick="addScore(2, 100)">+100</button>
          <button class="score-btn" onclick="addScore(2, -50)">-50</button>
        </div>
      </div>

      <div class="team-card">
        <div class="team-header">
          <span class="team-name" id="tname-3">Team D</span>

        </div>
        <div class="team-score" id="score-3">0</div>
        <div class="score-controls">
          <button class="score-btn" onclick="addScore(3, 100)">+100</button>
          <button class="score-btn" onclick="addScore(3, -50)">-50</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Question Box -->
  <main>
    <div class="round-badge" id="round-badge">Unit 1: Number Systems Differences</div>
    <div class="question-box">
      <div class="question-text" id="question-text">Loading Question...</div>
    </div>

    <div class="options-grid">
      <div class="option-card opt-a" id="opt-0">
        <span class="shape">▲</span><span id="opt-text-0">Option A</span>
      </div>
      <div class="option-card opt-b" id="opt-1">
        <span class="shape">◆</span><span id="opt-text-1">Option B</span>
      </div>
      <div class="option-card opt-c" id="opt-2">
        <span class="shape">●</span><span id="opt-text-2">Option C</span>
      </div>
      <div class="option-card opt-d" id="opt-3">
        <span class="shape">■</span><span id="opt-text-3">Option D</span>
      </div>
    </div>
  </main>

  <!-- Control Buttons -->
  <footer>
    <button class="control-btn btn-nav" onclick="prevQuestion()">◄ Previous</button>
    <button class="control-btn btn-reveal" onclick="revealAnswer()">Show Answer 👁️</button>
    <button class="control-btn btn-finish" onclick="showWinnerModal()">Finish Game 🏆</button>
    <button class="control-btn btn-nav" onclick="nextQuestion()">Next Question ►</button>
  </footer>

  <!-- Winner Pop-up Modal -->
  <div class="modal-overlay" id="winner-modal">
    <div class="modal-content">
      <div class="trophy-icon">🏆</div>
      <div class="winner-title" id="winner-headline">CHAMPIONS!</div>
      <div class="winner-subtitle" id="winner-subtext">Great job Grade 8 ICT students!</div>
      <div class="leaderboard-list" id="leaderboard-body"></div>
      <button class="control-btn btn-reveal" onclick="closeWinnerModal()">Close & Continue</button>
    </div>
  </div>

  <script>
    // 120 DIFFERENCE & COMPARISON QUESTIONS (20+ PER UNIT ACROSS 6 UNITS)
    const questions = [
      // ==========================================
      // UNIT 1: NUMBER SYSTEMS DIFFERENCES (20 Qs)
      // ==========================================
      { round: "Unit 1: Number Systems", q: "What is the main difference between the Decimal system and the Binary system?", opts: ["Decimal uses 10 digits (0-9), while Binary uses only 2 digits (0 and 1)", "Decimal uses letters A-F, while Binary uses digits 0-9", "Binary is for humans, while Decimal is for computer memory", "Decimal has a base of 2, while Binary has a base of 10"], ans: 0 },
      { round: "Unit 1: Number Systems", q: "What is the difference between a Bit and a Byte?", opts: ["A Bit is 8 Bytes, while a Byte is 1 Bit", "A Bit is a single binary digit (0 or 1), while a Byte is a group of 8 Bits", "A Bit stores text, while a Byte stores numbers", "A Bit is Base 10, while a Byte is Base 16"], ans: 1 },
      { round: "Unit 1: Number Systems", q: "What is the difference in Base Value between Octal and Hexadecimal systems?", opts: ["Octal is Base 16, while Hexadecimal is Base 8", "Octal uses letters A-F, while Hexadecimal uses 0-7", "Octal is Base 8 (0-7), while Hexadecimal is Base 16 (0-9 and A-F)", "Octal is Base 2, while Hexadecimal is Base 10"], ans: 2 },
      { round: "Unit 1: Number Systems", q: "How does positional value differ between Decimal and Binary numbers?", opts: ["Decimal uses powers of 10 (10⁰, 10¹, 10²), while Binary uses powers of 2 (2⁰, 2¹, 2²)", "Decimal uses powers of 2, while Binary uses powers of 8", "Binary positional values decrease from right to left", "Decimal positional values are all equal to 10"], ans: 0 },
      { round: "Unit 1: Number Systems", q: "What is the difference when converting Decimal 13 and Decimal 10 to Binary?", opts: ["Decimal 13 = 1010₂, while Decimal 10 = 1101₂", "Decimal 13 = 1111₂, while Decimal 10 = 1000₂", "Decimal 13 = 1100₂, while Decimal 10 = 0011₂", "Decimal 13 = 1101₂, while Decimal 10 = 1010₂"], ans: 3 },
      { round: "Unit 1: Number Systems", q: "How do Hexadecimal digits A through F differ from standard Decimal numbers?", opts: ["Letters A-F represent values from 10 to 15 in Hexadecimal", "Letters A-F represent negative numbers in Binary", "Hexadecimal letters cannot be converted to Decimal", "A-F represent fractions in Octal"], ans: 0 },
      { round: "Unit 1: Number Systems", q: "What is the difference between a Nibble and a Byte?", opts: ["A Nibble is 4 bits (half a byte), while a Byte is 8 bits", "A Nibble is 8 bits, while a Byte is 4 bits", "A Nibble stores text, while a Byte stores audio", "A Nibble is Base 16, while a Byte is Base 2"], ans: 0 },
      { round: "Unit 1: Number Systems", q: "What is the difference between Kilobyte (KB) and Megabyte (MB)?", opts: ["1 MB equals 1024 KB (larger unit of storage)", "1 KB equals 1024 MB", "KB is used for videos, while MB is used for text only", "KB is Base 10, while MB is Base 16"], ans: 0 },
      { round: "Unit 1: Number Systems", q: "How does ASCII code differ from raw Binary numbers in computer memory?", opts: ["ASCII assigns specific binary values to represent text characters (letters/symbols)", "ASCII is Base 10, while Binary is Base 8", "ASCII is only used for images", "Raw binary cannot store text"], ans: 0 },
      { round: "Unit 1: Number Systems", q: "What is the difference between Least Significant Bit (LSB) and Most Significant Bit (MSB)?", opts: ["LSB is the rightmost bit with the lowest positional value, while MSB is the leftmost bit with the highest positional value", "LSB is the largest number, while MSB is zero", "LSB is used in Hexadecimal, while MSB is used in Octal", "There is no positional difference"], ans: 0 },
      { round: "Unit 1: Number Systems", q: "How does Base 8 (Octal) differ from Base 10 (Decimal) in digit range?", opts: ["Octal uses digits 0 through 7 only, while Decimal uses digits 0 through 9", "Octal uses digits 0 through 9, while Decimal uses A-F", "Octal has 10 digits, Decimal has 8", "Octal uses base 2"], ans: 0 },
      { round: "Unit 1: Number Systems", q: "What is the difference between Signed Binary and Unsigned Binary numbers?", opts: ["Signed binary includes a bit to represent positive or negative values, while unsigned binary represents only positive numbers", "Signed binary is Base 16, unsigned is Base 2", "Unsigned binary uses letters", "There is no difference"], ans: 0 },
      { round: "Unit 1: Number Systems", q: "How does 1's Complement differ from 2's Complement in binary arithmetic?", opts: ["1's complement inverts all bits (0 to 1, 1 to 0), while 2's complement adds 1 to the 1's complement result", "1's complement adds 2, while 2's complement subtracts 1", "1's complement is for decimal numbers only", "2's complement inverts nothing"], ans: 0 },
      { round: "Unit 1: Number Systems", q: "What is the difference between Gigabyte (GB) and Terabyte (TB)?", opts: ["1 TB equals 1024 GB (larger storage capacity)", "1 GB equals 1024 TB", "GB is used for printing, while TB is used for sound", "TB is smaller than GB"], ans: 0 },
      { round: "Unit 1: Number Systems", q: "How does BCD (Binary Coded Decimal) differ from Pure Binary representation?", opts: ["BCD encodes each decimal digit separately into 4-bit binary groups, while pure binary converts the entire decimal number into one single binary value", "BCD is Base 16, pure binary is Base 8", "BCD cannot be read by computers", "Pure binary uses letters"], ans: 0 },
      { round: "Unit 1: Number Systems", q: "What is the difference between a 32-bit word size and a 64-bit word size?", opts: ["64-bit systems can process twice as much data per clock cycle and address significantly more memory than 32-bit systems", "32-bit systems are faster than 64-bit", "32-bit uses base 10, 64-bit uses base 2", "There is no processing difference"], ans: 0 },
      { round: "Unit 1: Number Systems", q: "How do binary fractions differ from whole binary numbers in positional values?", binaryFraction: true, opts: ["Binary fractions use negative powers of 2 to the right of the binary point (2⁻¹, 2⁻², etc.), while whole numbers use positive powers of 2", "Binary fractions use powers of 10", "Fractions cannot be represented in binary", "Binary point works exactly like decimal point with base 10"], ans: 0 },
      { round: "Unit 1: Number Systems", q: "What is the difference between Fixed-point and Floating-point number representations?", opts: ["Fixed-point has a fixed number of decimal/binary places, while Floating-point can represent a very wide range of very large or very small numbers using an exponent", "Fixed-point changes dynamically, while floating-point is constant", "Fixed-point is for text, floating-point for sound", "There is no difference"], ans: 0 },
      { round: "Unit 1: Number Systems", q: "How does Hexadecimal notation differ from Binary in expressing large memory addresses?", opts: ["Hexadecimal is much more compact, representing every 4 binary bits with a single hex character", "Hexadecimal takes 4 times more space than binary", "Binary is more compact than hex", "Hexadecimal uses base 2"], ans: 0 },
      { round: "Unit 1: Number Systems", q: "What is the difference between Base 2 and Base 16 in terms of digital hardware implementation?", opts: ["Base 2 directly maps to electronic ON/OFF voltage states (transistors), while Base 16 is a human-readable shorthand for binary groups", "Base 16 requires vacuum tubes, base 2 requires Wi-Fi", "Base 2 is slower than base 16", "There is no hardware distinction"], ans: 0 },

      // ====================================================
      // UNIT 2: OPERATING SYSTEMS & HARDWARE DIFFERENCES (20 Qs)
      // ====================================================
      { round: "Unit 2: OS & Hardware", q: "What is the difference between Read-only and Hidden file attributes?", opts: ["Read-only prevents editing/saving changes, while Hidden conceals the file from normal view", "Read-only deletes the file, while Hidden locks the CPU", "Read-only makes the file invisible, while Hidden allows editing", "There is no difference between them"], ans: 0 },
      { round: "Unit 2: OS & Hardware", q: "What is the key difference between a VGA port and an HDMI port?", opts: ["VGA carries audio only, while HDMI carries video only", "VGA carries analog video only (15-pin blue), while HDMI carries BOTH digital video AND audio", "VGA connects to the Internet, while HDMI connects a keyboard", "VGA is wireless, while HDMI requires 5 cables"], ans: 1 },
      { round: "Unit 2: OS & Hardware", q: "What is the difference between a PS/2 Keyboard port and a PS/2 Mouse port?", opts: ["Keyboard PS/2 is Purple, while Mouse PS/2 is Green", "Keyboard PS/2 is Green, while Mouse PS/2 is Purple", "Keyboard PS/2 uses 15 pins, while Mouse PS/2 uses HDMI", "They are identical in color and interchangeable"], ans: 0 },
      { round: "Unit 2: OS & Hardware", q: "What is the difference between Hardware Troubleshooting and Software Troubleshooting?", opts: ["Hardware troubleshooting cleans files, while Software troubleshooting fixes wires", "Hardware troubleshooting is done online, while Software troubleshooting opens the CPU", "Hardware troubleshooting fixes physical components, while Software troubleshooting fixes program errors", "Hardware troubleshooting affects only Microsoft Word"], ans: 2 },
      { round: "Unit 2: OS & Hardware", q: "How does an RJ45 port differ from an eSATA port?", opts: ["RJ45 connects speakers, while eSATA connects a microphone", "RJ45 connects Ethernet network cables, while eSATA connects external storage drives", "RJ45 is for video display, while eSATA is for wireless internet", "RJ45 uses 15 pins, while eSATA is a blue round connector"], ans: 1 },
      { round: "Unit 2: OS & Hardware", q: "What is the difference between RAM (Random Access Memory) and Hard Disk Drive (HDD)?", opts: ["RAM is fast volatile working memory that clears when power turns off, while HDD is non-volatile permanent storage", "RAM is permanent storage, while HDD is temporary memory", "RAM is slower than HDD", "RAM stores operating systems permanently"], ans: 0 },
      { round: "Unit 2: OS & Hardware", q: "What is the difference between System Software (OS) and Application Software?", opts: ["OS manages hardware and system resources, while Application software helps users perform specific tasks", "OS is used for typing letters, while Application software boots computer", "OS requires HTML, while Application software requires binary cables", "OS works only on phones, while Application software works on projectors"], ans: 0 },
      { round: "Unit 2: OS & Hardware", q: "How does a CLI (Command Line Interface) differ from a GUI (Graphical User Interface)?", opts: ["CLI requires typing text commands, while GUI uses visual icons, windows, and mouse clicks", "CLI uses a mouse, while GUI requires text typing", "CLI is newer than GUI", "GUI cannot open files"], ans: 0 },
      { round: "Unit 2: OS & Hardware", q: "What is the difference between USB Type-A and USB Type-C connectors?", opts: ["Type-A is rectangular and directional, while Type-C is smaller, oval, and reversible", "Type-A is reversible, Type-A is not", "Type-A carries power only, Type-C carries video only", "There is no difference"], ans: 0 },
      { round: "Unit 2: OS & Hardware", q: "What is the difference between Audio Line-In (Blue), Line-Out (Green), and Microphone (Pink) ports?", opts: ["Line-In receives audio from external devices, Line-Out connects speakers/headphones, and Microphone connects a mic", "Line-In is for power, Line-Out is for internet", "All three ports are identical in function", "Microphone port connects video displays"], ans: 0 },
      { round: "Unit 2: OS & Hardware", q: "How does an SSD (Solid State Drive) differ from a traditional HDD (Hard Disk Drive)?", opts: ["SSD uses flash memory with no moving parts (faster/silent), while HDD uses spinning magnetic disks", "SSD has spinning disks, while SSD is silent", "HDD is faster than SSD", "SSD requires magnetic tape"], ans: 0 },
      { round: "Unit 2: OS & Hardware", q: "What is the difference between Input devices and Output devices in the IPO model?", opts: ["Input devices feed data into the computer (Keyboard/Mouse), while Output devices display or output results (Monitor/Printer)", "Input devices display results, while Output devices enter data", "Input devices are software", "Output devices process CPU cycles"], ans: 0 },
      { round: "Unit 2: OS & Hardware", q: "What is the difference between a Cold Boot and a Warm Boot?", opts: ["Cold boot turns on the computer from a completely powered-off state, while warm boot restarts the OS without turning off power", "Cold boot restarts the PC, warm boot turns it off", "Cold boot clears RAM, warm boot clears CPU", "They are identical"], ans: 0 },
      { round: "Unit 2: OS & Hardware", q: "How does Multitasking OS differ from Single-task OS?", opts: ["Multitasking OS runs multiple programs concurrently, while Single-task OS runs only one program at a time", "Single-task OS runs 10 apps at once", "Multitasking OS is for calculators only", "There is no difference"], ans: 0 },
      { round: "Unit 2: OS & Hardware", q: "What is the difference between Open Source OS (like Linux) and Proprietary OS (like Windows)?", opts: ["Open source allows users to view, modify, and share source code, while proprietary source code is restricted and owned by a company", "Proprietary OS is always free", "Linux is proprietary, Windows is open source", "Open source is illegal"], ans: 0 },
      { round: "Unit 2: OS & Hardware", q: "What is the difference between a Device Driver and Application Software?", opts: ["Device driver is system software that allows the OS to communicate with hardware, while application software is for user tasks", "Driver is a game, application is a printer cable", "Driver edits documents", "There is no difference"], ans: 0 },
      { round: "Unit 2: OS & Hardware", q: "How does CPU Cache memory (L1/L2/L3) differ from Main RAM?", opts: ["CPU Cache is extremely fast, small memory built directly on or near the CPU, while RAM is larger and further away", "RAM is faster than cache", "Cache stores permanent files", "RAM is built inside the CPU ALU"], ans: 0 },
      { round: "Unit 2: OS & Hardware", q: "What is the difference between a Parallel Port and a USB Port?", opts: ["Parallel port used 25 pins for older printers (slow), while USB is a fast universal serial port for modern devices", "Parallel port is wireless, USB uses 50 pins", "USB is slower than parallel port", "Parallel port is used for mice"], ans: 0 },
      { round: "Unit 2: OS & Hardware", q: "What is the difference between Expansion Slots (PCIe) and External Ports?", opts: ["Expansion slots are inside the computer on the motherboard to add internal cards, while external ports are on the case for peripheral cables", "Expansion slots are outside the computer", "External ports are inside the CPU", "They are identical"], ans: 0 },
      { round: "Unit 2: OS & Hardware", q: "What is the difference between the Archive file attribute and the System file attribute?", opts: ["Archive indicates whether a file needs backup, while System marks essential OS files that should not be accidentally modified or deleted", "Archive hides files, System prints files", "System attribute deletes files", "There is no difference"], ans: 0 },

      // =======================================================
      // UNIT 3: WORD PROCESSING TOOL DIFFERENCES (20 Qs)
      // =======================================================
      { round: "Unit 3: Word Processing", q: "What is the difference between Subscript and Superscript in text formatting?", opts: ["Subscript lowers text below the baseline (H₂O), while Superscript raises text above (x²)", "Subscript raises text above, while Superscript lowers text below", "Subscript makes text bold, while Superscript makes text italic", "Subscript changes font size, while Superscript changes font color"], ans: 0 },

    ];

    let currentQIndex = 0;
    let scores = [0, 0, 0, 0];
    let teamNames = ["Team A", "Team B", "Team C", "Team D"];
    let isRevealed = false;

    function renderQuestion() {
      isRevealed = false;
      const q = questions[currentQIndex];
      
      document.getElementById("round-badge").textContent = q.round;
      document.getElementById("q-counter").textContent = `Question ${currentQIndex + 1} / ${questions.length}`;
      document.getElementById("question-text").textContent = q.q;

      for (let i = 0; i < 4; i++) {
        const optEl = document.getElementById(`opt-${i}`);
        const textEl = document.getElementById(`opt-text-${i}`);
        textEl.textContent = q.opts[i];
        optEl.classList.remove("dimmed", "correct-answer");
      }
    }

    function revealAnswer() {
      if (isRevealed) return;
      isRevealed = true;
      const correctAns = questions[currentQIndex].ans;

      for (let i = 0; i < 4; i++) {
        const optEl = document.getElementById(`opt-${i}`);
        if (i === correctAns) {
          optEl.classList.add("correct-answer");
        } else {
          optEl.classList.add("dimmed");
        }
      }
    }

    function nextQuestion() {
      if (currentQIndex < questions.length - 1) {
        currentQIndex++;
        renderQuestion();
      } else {
        showWinnerModal();
      }
    }

    function prevQuestion() {
      if (currentQIndex > 0) {
        currentQIndex--;
        renderQuestion();
      }
    }

    function addScore(teamIndex, points) {
      scores[teamIndex] += points;
      document.getElementById(`score-${teamIndex}`).textContent = scores[teamIndex];
    }

    function renameTeam(teamIndex) {
      const newName = prompt(`Enter custom name for ${teamNames[teamIndex]}:`, teamNames[teamIndex]);
      if (newName && newName.trim() !== "") {
        teamNames[teamIndex] = newName.trim();
        document.getElementById(`tname-${teamIndex}`).textContent = teamNames[teamIndex];
      }
    }

    function showWinnerModal() {
      const modal = document.getElementById("winner-modal");
      const headline = document.getElementById("winner-headline");
      const subtext = document.getElementById("winner-subtext");
      const leaderboardBody = document.getElementById("leaderboard-body");

      // Sort teams by score
      const teamObjects = teamNames.map((name, idx) => ({ name: name, score: scores[idx] }));
      teamObjects.sort((a, b) => b.score - a.score);

      const topScore = teamObjects[0].score;
      const winners = teamObjects.filter(t => t.score === topScore);

      if (winners.length === 1) {
        headline.textContent = `🏆 WINNER: ${winners[0].name.toUpperCase()}!`;
        subtext.textContent = `Outstanding Performance with ${winners[0].score} Points!`;
      } else {
        const winnerNames = winners.map(w => w.name).join(" & ");
        headline.textContent = `🤝 IT'S A TIE!`;
        subtext.textContent = `${winnerNames} tied with ${topScore} Points!`;
      }

      leaderboardBody.innerHTML = "";
      const rankClasses = ["rank-1", "rank-2", "rank-3", "rank-4"];
      const rankLabels = ["1st Place 🥇", "2nd Place 🥈", "3rd Place 🥉", "4th Place 🎗️"];

      teamObjects.forEach((t, i) => {
        const item = document.createElement("div");
        item.className = `leaderboard-item ${rankClasses[i]}`;
        item.innerHTML = `<span>${rankLabels[i]} — ${t.name}</span><span>${t.score} pts</span>`;
        leaderboardBody.appendChild(item);
      });

      modal.style.display = "flex";
    }

    function closeWinnerModal() {
      document.getElementById("winner-modal").style.display = "none";
    }

    // Keyboard Shortcuts
    document.addEventListener('keydown', function(event) {
      if (event.code === 'ArrowRight') nextQuestion();
      if (event.code === 'ArrowLeft') prevQuestion();
      if (event.code === 'Space') revealAnswer();
    });

    // Initialize Game
    renderQuestion();
  </script>
</body>
</html>
