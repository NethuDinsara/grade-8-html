<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade 8 ICT - Complete Theory Challenge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; position: relative; }
    
    /* Top Header & Scoreboard */
    header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); margin-bottom: 20px; border: 1px solid #334155; }
    .game-title { font-size: 1.5rem; font-weight: bold; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .q-counter { font-size: 1.2rem; background: #334155; padding: 6px 18px; border-radius: 20px; font-weight: 600; color: #f1f5f9; }
    
    /* Scoreboard & Team Cards */
    .scoreboard { display: flex; gap: 12px; }
    .team-card { background: #0f172a; padding: 8px 12px; border-radius: 12px; border: 1px solid #475569; text-align: center; min-width: 110px; display: flex; flex-direction: column; justify-content: space-between; }
    .team-header { display: flex; justify-content: center; align-items: center; gap: 4px; }
    .team-name { font-size: 0.85rem; color: #38bdf8; font-weight: bold; text-transform: uppercase; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rename-btn { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 0.75rem; }
    .rename-btn:hover { color: #f59e0b; }
    .team-score { font-size: 1.4rem; font-weight: bold; color: #f59e0b; margin: 2px 0; }
    .score-controls { display: flex; justify-content: center; gap: 4px; }
    .score-btn { background: #334155; color: #fff; border: none; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
    .score-btn:hover { background: #475569; }

    /* Main Question Box */
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 1200px; margin: 0 auto; width: 100%; }
    .round-badge { align-self: center; background: #8b5cf6; color: #fff; padding: 6px 22px; border-radius: 20px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; font-size: 0.95rem; box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3); }
    
    .question-box { background: #1e293b; padding: 35px 30px; border-radius: 20px; text-align: center; box-shadow: 0 15px 30px rgba(0,0,0,0.4); margin-bottom: 25px; border: 2px solid #334155; min-height: 140px; display: flex; align-items: center; justify-content: center; }
    .question-text { font-size: 1.8rem; font-weight: 700; line-height: 1.35; color: #f8fafc; }

    /* Options Grid (Kahoot Theme) */
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
    .option-card { padding: 22px 20px; border-radius: 16px; display: flex; align-items: center; font-size: 1.3rem; font-weight: 600; cursor: pointer; transition: transform 0.15s ease, opacity 0.3s ease; box-shadow: 0 8px 20px rgba(0,0,0,0.25); }
    .option-card:hover { transform: translateY(-3px); }
    
    .shape { font-size: 2rem; margin-right: 18px; opacity: 0.95; }
    .opt-a { background-color: #e21b3c; color: white; }
    .opt-b { background-color: #1368ce; color: white; }
    .opt-c { background-color: #d89e00; color: white; }
    .opt-d { background-color: #26890c; color: white; }

    .dimmed { opacity: 0.2; transform: scale(0.98); }
    .correct-answer { transform: scale(1.03); outline: 4px solid #ffffff; box-shadow: 0 0 35px rgba(255,255,255,0.8); animation: pulse 1s infinite alternate; }

    @keyframes pulse {
      from { box-shadow: 0 0 15px rgba(255,255,255,0.4); }
      to { box-shadow: 0 0 35px rgba(255,255,255,0.95); }
    }

    /* Footer Controls */
    footer { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; width: 100%; background: #1e293b; padding: 15px 25px; border-radius: 16px; border: 1px solid #334155; }
    .control-btn { padding: 12px 26px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    .btn-nav { background: #475569; color: white; }
    .btn-nav:hover { background: #64748b; }
    .btn-reveal { background: #f59e0b; color: #0f172a; font-size: 1.25rem; padding: 12px 36px; }
    .btn-reveal:hover { background: #d97706; }
    .btn-finish { background: #ec4899; color: white; }
    .btn-finish:hover { background: #db2777; }

    /* Winner Popup Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #1e293b; border: 3px solid #f59e0b; border-radius: 24px; padding: 40px; text-align: center; max-width: 650px; width: 90%; box-shadow: 0 25px 50px rgba(0,0,0,0.6); animation: modalPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    
    @keyframes modalPop {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .trophy-icon { font-size: 4.5rem; margin-bottom: 10px; animation: bounce 1s infinite alternate; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-12px); } }
    
    .winner-title { font-size: 2.2rem; color: #f59e0b; font-weight: bold; margin-bottom: 8px; }
    .winner-subtitle { font-size: 1.2rem; color: #cbd5e1; margin-bottom: 25px; }
    .leaderboard-list { margin-bottom: 30px; text-align: left; background: #0f172a; border-radius: 16px; padding: 15px 20px; border: 1px solid #334155; }
    .leaderboard-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1e293b; font-size: 1.2rem; font-weight: 600; }
    .leaderboard-item:last-child { border-bottom: none; }
    .rank-1 { color: #f59e0b; }
    .rank-2 { color: #94a3b8; }
    .rank-3 { color: #b45309; }
    .rank-4 { color: #64748b; }
  </style>
</head>
<body>

  <!-- Header with Scoreboard & Team Rename -->
  <header>
    <div class="game-title">🎮 Grade 8 ICT Challenge</div>
    <div class="q-counter" id="q-counter">Question 1 / 60</div>
    <div class="scoreboard">
      <div class="team-card">
        <div class="team-header">
          <span class="team-name" id="tname-0">Team A</span>
          <button class="rename-btn" onclick="renameTeam(0)" title="Rename Team">✏️</button>
        </div>
        <div class="team-score" id="score-0">0</div>
        <div class="score-controls">
          <button class="score-btn" onclick="addScore(0, 100)">+100</button>
          <button class="score-btn" onclick="addScore(0, -50)">-50</button>
        </div>
      </div>

      <div class="team-card">
        <div class="team-header">
          <span class="team-name" id="tname-1">Team B</span>
          <button class="rename-btn" onclick="renameTeam(1)" title="Rename Team">✏️</button>
        </div>
        <div class="team-score" id="score-1">0</div>
        <div class="score-controls">
          <button class="score-btn" onclick="addScore(1, 100)">+100</button>
          <button class="score-btn" onclick="addScore(1, -50)">-50</button>
        </div>
      </div>

      <div class="team-card">
        <div class="team-header">
          <span class="team-name" id="tname-2">Team C</span>
          <button class="rename-btn" onclick="renameTeam(2)" title="Rename Team">✏️</button>
        </div>
        <div class="team-score" id="score-2">0</div>
        <div class="score-controls">
          <button class="score-btn" onclick="addScore(2, 100)">+100</button>
          <button class="score-btn" onclick="addScore(2, -50)">-50</button>
        </div>
      </div>

      <div class="team-card">
        <div class="team-header">
          <span class="team-name" id="tname-3">Team D</span>
          <button class="rename-btn" onclick="renameTeam(3)" title="Rename Team">✏️</button>
        </div>
        <div class="team-score" id="score-3">0</div>
        <div class="score-controls">
          <button class="score-btn" onclick="addScore(3, 100)">+100</button>
          <button class="score-btn" onclick="addScore(3, -50)">-50</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Question Box -->
  <main>
    <div class="round-badge" id="round-badge">Unit 1: Number Systems</div>
    <div class="question-box">
      <div class="question-text" id="question-text">Loading Question...</div>
    </div>

    <div class="options-grid">
      <div class="option-card opt-a" id="opt-0">
        <span class="shape">▲</span><span id="opt-text-0">Option A</span>
      </div>
      <div class="option-card opt-b" id="opt-1">
        <span class="shape">◆</span><span id="opt-text-1">Option B</span>
      </div>
      <div class="option-card opt-c" id="opt-2">
        <span class="shape">●</span><span id="opt-text-2">Option C</span>
      </div>
      <div class="option-card opt-d" id="opt-3">
        <span class="shape">■</span><span id="opt-text-3">Option D</span>
      </div>
    </div>
  </main>

  <!-- Control Buttons -->
  <footer>
    <button class="control-btn btn-nav" onclick="prevQuestion()">◄ Previous</button>
    <button class="control-btn btn-reveal" onclick="revealAnswer()">Show Answer 👁️</button>
    <button class="control-btn btn-finish" onclick="showWinnerModal()">Finish Game 🏆</button>
    <button class="control-btn btn-nav" onclick="nextQuestion()">Next Question ►</button>
  </footer>

  <!-- Winner Pop-up Modal -->
  <div class="modal-overlay" id="winner-modal">
    <div class="modal-content">
      <div class="trophy-icon">🏆</div>
      <div class="winner-title" id="winner-headline">CHAMPIONS!</div>
      <div class="winner-subtitle" id="winner-subtext">Great job Grade 8 ICT students!</div>
      <div class="leaderboard-list" id="leaderboard-body">
        <!-- Ranks dynamically added -->
      </div>
      <button class="control-btn btn-reveal" onclick="closeWinnerModal()">Close & Continue</button>
    </div>
  </div>

  <script>
    // 60 QUESTIONS COVERING ALL 6 UNITS (10 QUESTIONS PER UNIT)
    const questions = [
      // --- UNIT 1: NUMBER SYSTEMS ---
      { round: "Unit 1: Number Systems", q: "What is the base of the binary number system?", opts: ["Base 2", "Base 10", "Base 8", "Base 16"], ans: 0 },
      { round: "Unit 1: Number Systems", q: "Which symbols are used in the decimal number system?", opts: ["0 and 1", "0 to 7", "0 to 9", "A to F"], ans: 2 },
      { round: "Unit 1: Number Systems", q: "What is a group of 8 bits called?", opts: ["A Nibble", "A Byte", "A Word", "A Kilobyte"], ans: 1 },
      { round: "Unit 1: Number Systems", q: "What is the base of the octal number system?", opts: ["Base 2", "Base 8", "Base 10", "Base 16"], ans: 1 },
      { round: "Unit 1: Number Systems", q: "What is the base of the hexadecimal number system?", opts: ["Base 8", "Base 10", "Base 2", "Base 16"], ans: 3 },
      { round: "Unit 1: Number Systems", q: "What is the binary equivalent of decimal number 2?", opts: ["10₂", "11₂", "01₂", "100₂"], ans: 0 },
      { round: "Unit 1: Number Systems", q: "What is the decimal value of binary number 101₂?", opts: ["3", "4", "5", "6"], ans: 2 },
      { round: "Unit 1: Number Systems", q: "Why do computers convert all input data into binary numbers?", opts: ["Because computers only understand 0 and 1 states", "Because binary numbers are colorful", "Because humans prefer binary numbers", "Because binary takes less screen space"], ans: 0 },
      { round: "Unit 1: Number Systems", q: "What do the digits 0 and 1 represent inside computer hardware?", opts: ["Red and Green light", "OFF and ON states", "Text and Sound", "Input and Output"], ans: 1 },
      { round: "Unit 1: Number Systems", q: "What is the place value of the rightmost bit (2⁰) in a binary number?", opts: ["2", "8", "0", "1"], ans: 3 },

      // --- UNIT 2: CONFIGURING AND FORMATTING A COMPUTER ---
      { round: "Unit 2: Computer Configuration", q: "Why is it important to set the correct time zone on a computer?", opts: ["For legal, commercial, and scheduled software updates", "To change desktop background color", "To increase internet speed", "To make the mouse move faster"], ans: 0 },
      { round: "Unit 2: Computer Configuration", q: "Which file attribute makes a file invisible during normal viewing?", opts: ["Read-only", "Hidden", "Archived", "Executable"], ans: 1 },
      { round: "Unit 2: Computer Configuration", q: "Which file attribute prevents users from modifying or saving changes to a file?", opts: ["Hidden", "Read-only", "System", "Temporary"], ans: 1 },
      { round: "Unit 2: Computer Configuration", q: "Which port transmits both digital video and audio signals?", opts: ["VGA port", "PS/2 port", "HDMI port", "Serial port"], ans: 2 },
      { round: "Unit 2: Computer Configuration", q: "What color is typically used for a PS/2 keyboard port?", opts: ["Purple", "Green", "Blue", "Yellow"], ans: 0 },
      { round: "Unit 2: Computer Configuration", q: "What port is used to connect network cables in computer labs?", opts: ["RJ45 Ethernet port", "HDMI port", "VGA port", "Audio port"], ans: 0 },
      { round: "Unit 2: Computer Configuration", q: "Which utility tool is used by the operating system to remove unnecessary files from the hard disk?", opts: ["Disk Cleanup", "Notepad", "Paint", "Calculator"], ans: 0 },
      { round: "Unit 2: Computer Configuration", q: "What is a computer virus?", opts: ["A hardware cooling fan", "Malicious software that harms systems and replicates itself", "An internet browser", "A sound driver"], ans: 1 },
      { round: "Unit 2: Computer Configuration", q: "Which blue colored port with 15 pins is used for older monitors?", opts: ["VGA port", "USB port", "HDMI port", "eSATA port"], ans: 0 },
      { round: "Unit 2: Computer Configuration", q: "Which Windows 10 display mode hides desktop icons and uses full-screen tiles?", opts: ["PC mode", "Safe mode", "Tablet mode", "Dark mode"], ans: 2 },

      // --- UNIT 3: WORD PROCESSING ---
      { round: "Unit 3: Word Processing", q: "What tool in word processing software checks spelling and grammar mistakes?", opts: ["Word Art", "Spell check", "Format Painter", "Clip Art"], ans: 1 },
      { round: "Unit 3: Word Processing", q: "Which formatting style places text slightly below the normal text line (like H₂O)?", opts: ["Superscript", "Subscript", "Bold", "Italic"], ans: 1 },
      { round: "Unit 3: Word Processing", q: "Which formatting style places text slightly above the normal text line (like x²)?", opts: ["Subscript", "Superscript", "Underline", "Shading"], ans: 1 },
      { round: "Unit 3: Word Processing", q: "What command saves changes made to the current document?", opts: ["Open", "Save", "Print", "Close"], ans: 1 },
      { round: "Unit 3: Word Processing", q: "What is the difference between 'Save' and 'Save As'?", opts: ["Save deletes the file, Save As prints it", "Save updates current file, Save As saves a copy with a new name", "Save is for images only, Save As is for text", "There is no difference"], ans: 1 },
      { round: "Unit 3: Word Processing", q: "Which alignment tool aligns text evenly along both left and right margins?", opts: ["Left align", "Center", "Right align", "Justify"], ans: 3 },
      { round: "Unit 3: Word Processing", q: "What tool is used to insert decorative and artistic text in a document?", opts: ["Word Art", "Clip Art", "Table", "Shape"], ans: 0 },
      { round: "Unit 3: Word Processing", q: "Which button cancels your last action in word processing software?", opts: ["Redo", "Undo", "Cut", "Copy"], ans: 1 },
      { round: "Unit 3: Word Processing", q: "What tool colors the background behind text or paragraphs?", opts: ["Font color", "Shading", "Highlight", "Underline"], ans: 1 },
      { round: "Unit 3: Word Processing", q: "Which feature adds small dots or symbols before items in a list?", opts: ["Numbering", "Bullets", "Tables", "Borders"], ans: 1 },

      // --- UNIT 4: PROGRAMMING ---
      { round: "Unit 4: Programming", q: "What are the three main parts when analyzing a problem for programming?", opts: ["Start, Process, End", "Input, Process, Output", "Keyboard, CPU, Monitor", "Files, Folders, Drives"], ans: 1 },
      { round: "Unit 4: Programming", q: "What control structure executes steps one after another in order?", opts: ["Selection", "Repetition", "Sequence", "Loop"], ans: 2 },
      { round: "Unit 4: Programming", q: "What control structure makes decisions based on whether a condition is true or false?", opts: ["Sequence", "Selection", "Addition", "Division"], ans: 1 },
      { round: "Unit 4: Programming", q: "What flowchart shape is used for decisions and conditions (like Yes/No questions)?", opts: ["Rectangle", "Oval", "Parallelogram", "Diamond"], ans: 3 },
      { round: "Unit 4: Programming", q: "What does the MOD operator calculate in programming?", opts: ["The sum of two numbers", "The remainder of a division", "The product of numbers", "The average value"], ans: 1 },
      { round: "Unit 4: Programming", q: "Which Scratch selection block runs code only when a condition is true?", opts: ["if...then", "repeat...until", "stop all", "forever"], ans: 0 },
      { round: "Unit 4: Programming", q: "Which Scratch logical block returns true only if both conditions are true?", opts: ["or", "not", "and", "if"], ans: 2 },
      { round: "Unit 4: Programming", q: "Which Scratch logical block reverses a condition (true becomes false)?", opts: ["and", "not", "or", "mod"], ans: 1 },
      { round: "Unit 4: Programming", q: "Which smart device is a remotely controlled mini helicopter used to take aerial photos?", opts: ["Smart watch", "Smart TV", "Drone camera", "Smart phone"], ans: 2 },
      { round: "Unit 4: Programming", q: "What type of application uses GPS to direct users and find routes?", opts: ["Route map", "Sky map", "Chess game", "Voice recorder"], ans: 0 },

      // --- UNIT 5: PHYSICAL COMPUTING ---
      { round: "Unit 5: Physical Computing", q: "What are the three basic logic gates used in digital circuits?", opts: ["AND, OR, NOT", "ADD, SUB, MUL", "IN, OUT, MID", "HIGH, LOW, TRUE"], ans: 0 },
      { round: "Unit 5: Physical Computing", q: "In an AND gate, what must the inputs be to get an output of 1?", opts: ["At least one input must be 1", "Both inputs must be 1", "Both inputs must be 0", "Inputs do not matter"], ans: 1 },
      { round: "Unit 5: Physical Computing", q: "In an OR gate, what is the output if at least one input is 1?", opts: ["0", "1", "Depends on clock", "None"], ans: 1 },
      { round: "Unit 5: Physical Computing", q: "What is the output of a NOT gate if its input is 0?", opts: ["0", "1", "Both 0 and 1", "Null"], ans: 1 },
      { round: "Unit 5: Physical Computing", q: "What is the boolean mathematical expression for an AND gate with inputs A and B?", opts: ["A + B", "A · B", "Ā", "A = B"], ans: 1 },
      { round: "Unit 5: Physical Computing", q: "What is the boolean mathematical expression for an OR gate with inputs A and B?", opts: ["A · B", "A + B", "Ā", "A - B"], ans: 1 },
      { round: "Unit 5: Physical Computing", q: "What symbol is used to represent the inverted output of a NOT gate with input A?", opts: ["A'", "Ā", "A*", "A/"], ans: 1 },
      { round: "Unit 5: Physical Computing", q: "What voltage level typically represents binary state '1' in digital hardware?", opts: ["0V (Low)", "5V (High)", "100V", "12V"], ans: 1 },
      { round: "Unit 5: Physical Computing", q: "What voltage level represents binary state '0' in digital hardware?", opts: ["5V", "0V (Low)", "220V", "50V"], ans: 1 },
      { round: "Unit 5: Physical Computing", q: "Which logic gate acts like an inverter, changing 1 to 0 and 0 to 1?", opts: ["AND gate", "OR gate", "NOT gate", "Buffer"], ans: 2 },

      // --- UNIT 6: INTERNET ---
      { round: "Unit 6: Internet", q: "What software tool is used to search for websites and information on the web?", opts: ["Web browser", "Search engine", "Word processor", "Media player"], ans: 1 },
      { round: "Unit 6: Internet", q: "Which of the following is a popular web search engine?", opts: ["Microsoft Word", "Google", "Paint", "Scratch"], ans: 1 },
      { round: "Unit 6: Internet", q: "What feature in a web browser saves frequently visited web addresses for quick access?", opts: ["History", "Bookmarks", "Downloads", "Trash"], ans: 1 },
      { round: "Unit 6: Internet", q: "What browser feature keeps a log of all web pages you have previously visited?", opts: ["Bookmarks", "History", "Tabs", "Extensions"], ans: 1 },
      { round: "Unit 6: Internet", q: "What is a clickable text or image that takes you to another web page?", opts: ["Hyperlink", "Scrollbar", "Title bar", "Taskbar"], ans: 0 },
      { round: "Unit 6: Internet", q: "What allows you to open multiple web pages inside a single browser window?", opts: ["Windows", "Tabs", "Icons", "Menus"], ans: 1 },
      { round: "Unit 6: Internet", q: "What language is used to create and structure web pages?", opts: ["Java", "HTML", "Python", "Scratch"], ans: 1 },
      { round: "Unit 6: Internet", q: "Which HTML tag defines the main visible content of a web page?", opts: ["<head>", "<title>", "<body>", "<html"], ans: 2 },
      { round: "Unit 6: Internet", q: "Which HTML tag is used to create a hyperlink?", opts: ["<img>", "<a>", "<p>", "<br>"], ans: 1 },
      { round: "Unit 6: Internet", q: "Which HTML tag is used to insert an image into a web page?", opts: ["<img>", "<href>", "<title>", "<b>"], ans: 0 }
    ];

    let currentQIndex = 0;
    let scores = [0, 0, 0, 0];
    let teamNames = ["Team A", "Team B", "Team C", "Team D"];
    let isRevealed = false;

    function renderQuestion() {
      isRevealed = false;
      const q = questions[currentQIndex];
      
      document.getElementById("round-badge").textContent = q.round;
      document.getElementById("q-counter").textContent = `Question ${currentQIndex + 1} / ${questions.length}`;
      document.getElementById("question-text").textContent = q.q;

      for (let i = 0; i < 4; i++) {
        const optEl = document.getElementById(`opt-${i}`);
        const textEl = document.getElementById(`opt-text-${i}`);
        textEl.textContent = q.opts[i];
        optEl.classList.remove("dimmed", "correct-answer");
      }
    }

    function revealAnswer() {
      if (isRevealed) return;
      isRevealed = true;
      const correctAns = questions[currentQIndex].ans;

      for (let i = 0; i < 4; i++) {
        const optEl = document.getElementById(`opt-${i}`);
        if (i === correctAns) {
          optEl.classList.add("correct-answer");
        } else {
          optEl.classList.add("dimmed");
        }
      }
    }

    function nextQuestion() {
      if (currentQIndex < questions.length - 1) {
        currentQIndex++;
        renderQuestion();
      } else {
        showWinnerModal();
      }
    }

    function prevQuestion() {
      if (currentQIndex > 0) {
        currentQIndex--;
        renderQuestion();
      }
    }

    function addScore(teamIndex, points) {
      scores[teamIndex] += points;
      document.getElementById(`score-${teamIndex}`).textContent = scores[teamIndex];
    }

    function renameTeam(teamIndex) {
      const newName = prompt(`Enter custom name for ${teamNames[teamIndex]}:`, teamNames[teamIndex]);
      if (newName && newName.trim() !== "") {
        teamNames[teamIndex] = newName.trim();
        document.getElementById(`tname-${teamIndex}`).textContent = teamNames[teamIndex];
      }
    }

    function showWinnerModal() {
      const modal = document.getElementById("winner-modal");
      const headline = document.getElementById("winner-headline");
      const subtext = document.getElementById("winner-subtext");
      const leaderboardBody = document.getElementById("leaderboard-body");

      // Sort teams by score
      const teamObjects = teamNames.map((name, idx) => ({ name: name, score: scores[idx] }));
      teamObjects.sort((a, b) => b.score - a.score);

      const topScore = teamObjects[0].score;
      const winners = teamObjects.filter(t => t.score === topScore);

      if (winners.length === 1) {
        headline.textContent = `🏆 WINNER: ${winners[0].name.toUpperCase()}!`;
        subtext.textContent = `Outstanding Performance with ${winners[0].score} Points!`;
      } else {
        const winnerNames = winners.map(w => w.name).join(" & ");
        headline.textContent = `🤝 IT'S A TIE!`;
        subtext.textContent = `${winnerNames} tied with ${topScore} Points!`;
      }

      leaderboardBody.innerHTML =
